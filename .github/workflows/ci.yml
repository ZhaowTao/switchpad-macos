name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make all
      - name: Unit tests
        run: make test
      # A runner has no Nintendo pad. `list` deliberately exits 2 in that case;
      # any other non-zero status is a real failure and must stay red.
      - name: CLI runs and enumerates devices
        run: |
          rc=0
          ./build/swr-haptic list || rc=$?
          echo "swr-haptic list exit=$rc"
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]
